name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: python -m pip install -r requirements-dev.txt

      - name: ruff check
        run: python -m ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.12 is the floor: the pinned numpy, scipy, xgboost and shap releases all
      # declare Requires-Python >= 3.12.
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q

  smoke:
    name: End-to-end smoke (--sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Runs entirely against the committed offline sample: no network access,
      # so a UCI outage can never break this job.
      - name: Run the full pipeline on the offline sample
        run: python main.py --sample

      - name: Verify the expected artefacts were produced
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          reports = Path("reports")
          required = [
              reports / "governance_scorecard.md",
              reports / "governance_scorecard.json",
              reports / "model_card_logistic_regression.md",
              reports / "model_card_xgboost.md",
              reports / "model_card_lightgbm.md",
          ]

          missing = [str(path) for path in required if not path.exists()]
          if missing:
              sys.exit(f"Pipeline did not produce: {missing}")

          payload = json.loads((reports / "governance_scorecard.json").read_text())

          expected_gates = {
              "fairness",
              "drift",
              "calibration",
              "uncertainty",
              "segment_stability",
          }
          if len(payload["models"]) != 3:
              sys.exit(f"Expected 3 benchmarked models, got {len(payload['models'])}")

          for model in payload["models"]:
              gates = set(model["gates"])
              if gates != expected_gates:
                  sys.exit(f"{model['model_name']} ran gates {gates}, expected {expected_gates}")
              if not 0.5 < model["metrics"]["roc_auc"] <= 1.0:
                  sys.exit(f"{model['model_name']} ROC-AUC {model['metrics']['roc_auc']} is not above chance")

          if not payload["segment_shrinkage"]["prior"]["alpha"] > 0:
              sys.exit("Segment shrinkage prior was not fitted")

          print(f"Smoke OK: overall verdict '{payload['overall_status']}', "
                f"selected model '{payload['selected_model']}'")
          for model in payload["models"]:
              print(f"  {model['model_name']}: ROC-AUC {model['metrics']['roc_auc']:.4f} "
                    f"gates {model['gate_status']}")
          PY

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-reports
          path: reports/
          # warn, not error: if the pipeline itself failed, that failure should be
          # what the run reports - not a missing-artifact error on top of it.
          if-no-files-found: warn
